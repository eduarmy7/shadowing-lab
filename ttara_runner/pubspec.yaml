name: ttara
description: "쉐도잉랩(ShadowingLab) — 자동으로 나눠주는 진짜 쉐도잉. 영어 쉐도잉 학습 앱"
publish_to: 'none'
version: 1.0.0+13

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── 상태관리 / 라우팅 ─────────────────────────────
  # Riverpod: 학습 루프(#5)처럼 여러 화면·위젯이 동일 상태(재생/반복/진행률)를
  # 구독해야 하는 요구가 많아 Provider/Bloc 대비 보일러플레이트가 적고
  # 테스트용 override가 쉬운 flutter_riverpod을 채택 (코드젠 없는 수동 Provider 방식 —
  # build_runner 의존을 없애 스캐폴드 단계에서 즉시 컴파일 가능하도록 함).
  flutter_riverpod: ^2.5.1

  # go_router: StatefulShellRoute로 3탭(홈/라이브러리/마이) 각각 독립 스택을 유지하면서
  # 학습 화면 같은 풀스크린 라우트는 탭 밖에서 별도로 push.
  go_router: ^14.2.7

  # ── 오디오 재생 ───────────────────────────────────
  # 영상 파일도 오디오만 추출 재생(파형만 노출) — 배터리/성능 이점 (UX 문서 권장사항)
  just_audio: ^0.9.40
  # 2026-08-09: `just_audio_background`(단순 미러링, 재생/일시정지만 지원)에서
  # `audio_service`를 직접 쓰는 커스텀 AudioHandler로 교체했다 — 잠금화면/알림
  # 미니 플레이어에 "이전 문장/다음 문장" 같은 앱 고유 동작을 넣으려면 알림 버튼이
  # `just_audio`의 AudioPlayer를 직접 조작하는 게 아니라 우리 학습 컨트롤러를 거쳐야
  # 한다(`core/audio/study_audio_handler.dart` 참고). 부수 효과로, 알림에서 재생을
  # 누르면 문장 반복/속도 설정과 무관하게 파일 끝까지 재생되던 버그와, 정지 버튼을
  # 눌러도 알림이 사라졌다 스스로 다시 재생되던 버그도 함께 근본적으로 해결된다 —
  # 더 이상 알림이 재생기를 직접 건드리지 않기 때문이다.
  audio_service: ^0.18.19
  audio_session: ^0.1.21

  # ── 파일 입출력 / 권한 ────────────────────────────
  # 8.x는 자체 android/build.gradle이 compileSdk 34로 고정돼 있어 최근
  # flutter_plugin_android_lifecycle(compileSdk 36 요구)과 충돌 — 11.x로 상향.
  file_picker: ^11.0.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # ── 무음 감지(문장 분리) ──────────────────────────
  # 2026-08-05: 음성만 업로드된 파일의 실제 amplitude 분석 구현. 순수 Dart로는
  # mp3/m4a/mp4 디코딩이 불가능해 네이티브 디코더(Android MediaExtractor / iOS
  # AVAssetReader)를 감싼 최소 의존성 패키지를 채택 — ffmpeg_kit류 대비 바이너리가
  # 훨씬 가볍고(자체 의존성 없음) 재생 UI가 아닌 순수 파형 추출 API만 사용한다.
  # 2026-08-08: pub.dev 버전 대신 vendor/audio_waveforms(로컬 포크)를 사용한다 —
  # 원본 패키지의 O(N^2) 성능 버그(포인트마다 누적 배열 전체를 채널로 재전송)를
  # 패치한 버전. 자세한 내용은 vendor/audio_waveforms/PATCH_NOTES.md 참고.
  audio_waveforms:
    path: vendor/audio_waveforms

  # ── 화면 꺼짐 방지 (쉐도잉 학습 화면 Hands-free 모드 필수 전제) ──
  wakelock_plus: ^1.2.8

  # ── 외부 링크 ────────────────────────────────────
  # 구독 해지(#9)는 앱이 직접 처리할 수 없어 스토어 구독관리 화면으로 딥링크한다
  # (03_api_integration.md 6-3절, QA 🔴-4).
  url_launcher: ^6.3.1

  # ── 로컬 저장 ────────────────────────────────────
  # 스캐폴드 단계 저장소: SharedPreferences 기반 JSON 저장(코드젠 불필요, 즉시 동작).
  # 프로덕션 전환 시 Drift/Isar로 교체 권장 — Repository 인터페이스로 격리되어 있어
  # 구현체 교체만으로 마이그레이션 가능 (02_app_architecture.md 참고).
  shared_preferences: ^2.3.2

  # ── 유틸 ─────────────────────────────────────────
  equatable: ^2.0.5
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.18.0
  # 2026-08-22: 한글 뜻 절반 화면에 문장이 길면 한 줄로 욱여넣느라 글자가 너무
  # 작아지던 문제 수정용 — 순수 Dart(네이티브 코드 없음), 여러 줄로 줄바꿈하면서
  # 주어진 공간(높이+너비)에 맞는 가장 큰 글자 크기를 자동으로 찾아준다.
  auto_size_text: ^3.0.0
  # 2026-08-22: 사용자가 실사용 중 발견 — 다운로드한 한국어 SMI 자막 파일 다수가
  # EUC-KR(CP949)로 인코딩돼 있어, UTF-8 전제인 File.readAsString()이 깨진 텍스트나
  # FormatException을 내며 "지원하지 않는 자막 형식이에요"로 잘못 표시되던 버그 수정용.
  # 순수 Dart 구현(네이티브 플랫폼 채널 불필요)이라 이 프로젝트가 겪어온 네이티브
  # 플러그인 빌드 문제 계열과 무관하다.
  cp949_codec: ^1.0.2

  # ── 학습 리마인더 로컬 알림 ────────────────────────
  # 2026-08-10: 마이 > 알림 설정에서 "학습 리마인더"를 켜면 실제로 매일 그 시간에
  # 로컬 알림이 뜨게 한다(요청 전엔 켜고 꺼지는 스위치만 있고 실제 발동은 없었다).
  # 서버 푸시가 아니라 기기에서 예약하는 로컬 알림이라 백엔드/네트워크가 필요 없다.
  flutter_local_notifications: ^18.0.1
  # 로컬 알림의 "매일 이 시간에" 반복 예약(zonedSchedule)은 시간대 인식 DateTime이
  # 필요해서 timezone 패키지가 필수 동반 의존성이다.
  timezone: ^0.9.4

  # ── 광고(AdMob) ──────────────────────────────────
  # 2026-08-11: NoOpAdService 플레이스홀더를 실제 SDK로 교체(`core/ads/ad_mob_ad_service.dart`).
  # 2026-08-11: Android는 YBG Ltd 실제 AdMob 계정의 프로덕션 앱/광고단위 ID로 교체
  # 완료(`ad_mob_ad_service.dart`, AndroidManifest.xml). iOS는 아직 AdMob 앱을
  # 만들지 않아 Google 공식 테스트 ID로 남아있음 — iOS 출시 준비 시 교체 필요.
  google_mobile_ads: ^9.0.0

  # ── 인앱 구매(광고 제거) ────────────────────────────
  # 2026-08-11: FakePurchaseRepository(로컬 시뮬레이션) 대신 실제 Google Play
  # Billing 연동. 상품 ID는 PurchaseRepository.adRemovalProductId(현재 값
  # 'com.shadowinglab.remove_ads') — Play Console에서 인앱 상품을 만들 때 반드시
  # 이 문자열과 정확히 똑같이 등록해야 한다.
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  # QA 🔴-3: App Review 심사자를 포함해 자기 소유 파일이 없는 사용자도 핵심 기능
  # (AI 자동분리→쉐도잉)을 바로 체험할 수 있도록 앱 번들에 포함하는 샘플 오디오.
  # 현재 sample_interview_en.wav는 45초 무음 PCM 플레이스홀더(빌드 가능 여부 검증용) —
  # 실제 배포 전 반드시 라이선스가 명확한(CC0 등) 짧은 영어 발화 샘플로 교체할 것.
  assets:
    - assets/sample/
    - assets/branding/

  # Pretendard Variable 폰트는 라이선스 파일 배치가 필요해 이번 스캐폴드에는 포함하지 않음.
  # assets/fonts/ 에 Pretendard-*.otf 배치 후 아래 주석을 해제하면 즉시 적용됨.
  # 미적용 상태에서는 core/theme/app_typography.dart 의 fontFamily 지정이 시스템 폰트
  # (iOS: SF Pro / Android: Roboto)로 자동 폴백되므로 빌드에는 영향 없음.
  #
  # fonts:
  #   - family: Pretendard
  #     fonts:
  #       - asset: assets/fonts/Pretendard-Regular.otf
  #         weight: 400
  #       - asset: assets/fonts/Pretendard-Medium.otf
  #         weight: 500
  #       - asset: assets/fonts/Pretendard-SemiBold.otf
  #         weight: 600
  #       - asset: assets/fonts/Pretendard-Bold.otf
  #         weight: 700
